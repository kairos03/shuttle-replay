<rect x="0.5" y="0.5" width="519" height="645" rx="6" fill="#fbfbf8" stroke="#dfe5e1" stroke-width="1"/>
<text x="260" y="30" font-size="18" text-anchor="middle" fill="#20312b" font-weight="bold">Fluxo de dados das entradas revisadas até o</text>
<text x="260" y="53.4" font-size="18" text-anchor="middle" fill="#20312b" font-weight="bold">replay</text>
<rect x="20" y="75.5" width="146" height="86.8" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
