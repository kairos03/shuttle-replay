<text x="260" y="587" font-size="13" text-anchor="middle" fill="#5d6b65">run = analyze + render; o vídeo é verificado antes de os JSON serem</text>
<text x="260" y="603.9" font-size="13" text-anchor="middle" fill="#5d6b65">gravados</text>
<rect x="137.53" y="616.75" width="28" height="16" rx="3" fill="#ffffff" stroke="#20312b" stroke-width="1.2"/>
