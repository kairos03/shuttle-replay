<text x="93" y="152.1" font-size="13" text-anchor="middle" fill="#5d6b65">âncoras da rede</text>
<rect x="354" y="75.5" width="146" height="86.8" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
<text x="427" y="104.25" font-size="14" text-anchor="middle" fill="#20312b">JSON de</text>
<text x="427" y="121.75" font-size="14" text-anchor="middle" fill="#20312b">calibração</text>
<text x="427" y="143.65" font-size="13" text-anchor="middle" fill="#5d6b65">P, H, erros</text>
<rect x="198" y="99.9" width="124" height="38" rx="19" fill="#1f6b45" stroke="none" stroke-width="1"/>
<text x="260" y="123.45" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">calibrate</text>
