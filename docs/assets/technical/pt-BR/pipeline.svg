<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="pt-BR" width="520" height="646" viewBox="0 0 520 646" role="img" aria-labelledby="title desc" font-family="&#x27;Noto Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="title">Fluxo de dados das entradas revisadas até o replay</title>
<desc id="desc">O JSON de entrada de calibração passa por calibrate e gera o JSON de calibração. O JSON de calibração, tracks JSON e review JSON entram em analyze, que grava o JSON de análise. O vídeo de origem e o JSON de análise entram em render, que grava o MP4 de replay e o JSON do relatório de renderização. O comando run executa analyze e render em uma única etapa.</desc>
