<text x="93" y="212.6" font-size="14" text-anchor="middle" fill="#20312b">tracks JSON</text>
<text x="93" y="234.5" font-size="13" text-anchor="middle" fill="#5d6b65">suas detecções,</text>
<text x="93" y="251.4" font-size="13" text-anchor="middle" fill="#5d6b65">PTS</text>
<rect x="187" y="192.3" width="146" height="69.3" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
<text x="260" y="212.6" font-size="14" text-anchor="middle" fill="#20312b">review JSON</text>
<text x="260" y="234.5" font-size="13" text-anchor="middle" fill="#5d6b65">contatos, fins de</text>
<text x="260" y="251.4" font-size="13" text-anchor="middle" fill="#5d6b65">voo</text>
