<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="es" width="520" height="629" viewBox="0 0 520 629" role="img" aria-labelledby="title desc" font-family="&#x27;Noto Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="title">Flujo de datos desde las entradas revisadas hasta la repetición</title>
<desc id="desc">El JSON de entrada de calibración pasa por calibrate y da el JSON de calibración. El JSON de calibración, tracks JSON y review JSON entran en analyze, que escribe el JSON de análisis. El vídeo de origen y el JSON de análisis entran en render, que escribe el MP4 de repetición y el JSON del informe de renderizado. El comando run ejecuta analyze y render en un solo paso.</desc>
