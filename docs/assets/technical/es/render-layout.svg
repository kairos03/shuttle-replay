<svg xmlns="http://www.w3.org/2000/svg" xml:lang="es" width="520" height="534" viewBox="0 0 520 534" role="img" aria-labelledby="title desc" font-family="&#x27;Noto Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="title">Disposición del fotograma de repetición, 6:4</title>
<desc id="desc">El fotograma de salida coloca a la izquierda el fotograma de origen sin escalar y a la derecha la vista superior. Con un origen de 1920 x 1080 el lienzo mide 3200 x 1080 píxeles: panel de origen 1920 x 1080, panel de vista superior 1280 x 1080. La vista superior escala la pista de 6.10 x 13.40 m para que quepa conservando sus proporciones.</desc>
