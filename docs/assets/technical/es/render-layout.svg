<text x="260" y="54.1" font-size="20" text-anchor="middle" fill="#5d6b65">Ejemplo: origen de 1920 x 1080</text>
<text x="202" y="95.1" font-size="20" text-anchor="middle" fill="#20312b" font-weight="bold">fotograma de origen,</text>
<text x="202" y="121.1" font-size="20" text-anchor="middle" fill="#20312b" font-weight="bold">escala 1.0</text>
<text x="422" y="95.1" font-size="20" text-anchor="middle" fill="#20312b" font-weight="bold">vista superior</text>
