<text x="48" y="215.35" font-size="16" text-anchor="end" fill="#5d6b65">1080</text>
<text x="260" y="367.6" font-size="20" text-anchor="middle" fill="#20312b">tu fotograma de vídeo, sin remuestrear</text>
<text x="260" y="388.6" font-size="20" text-anchor="middle" fill="#20312b">ancho de la vista superior = 2 * round(W * 4 / 6 /</text>
<text x="260" y="414.6" font-size="20" text-anchor="middle" fill="#20312b">2) = 1280 px</text>
<text x="260" y="435.6" font-size="20" text-anchor="middle" fill="#20312b">W, H: tamaño de origen redondeado hacia arriba</text>
<text x="260" y="461.6" font-size="20" text-anchor="middle" fill="#20312b">a par</text>
<text x="260" y="482.6" font-size="20" text-anchor="middle" fill="#20312b">pista escalada para caber, proporciones</text>
<text x="260" y="508.6" font-size="20" text-anchor="middle" fill="#20312b">conservadas: 75.82 px/m</text>
