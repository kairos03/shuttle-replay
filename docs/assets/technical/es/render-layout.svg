<text x="422" y="345.6" font-size="20" text-anchor="middle" fill="#5d6b65">1280 px</text>
<line x1="48" y1="137.1" x2="60" y2="137.1" stroke="#20312b" stroke-width="1.1" stroke-linecap="butt"/>
