<title id="title">確認済み入力からリプレイまでのデータの流れ</title>
<desc id="desc">キャリブレーション入力 JSON は calibrate を通ってキャリブレーション JSON になります。キャリブレーション JSON、tracks JSON、review JSON は analyze に入り、解析 JSON が書き出されます。元動画と解析 JSON は render に入り、リプレイ MP4 とレンダーレポート JSON が書き出されます。run コマンドは analyze と render を一度に実行します。</desc>
