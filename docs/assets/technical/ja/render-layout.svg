<title id="title">リプレイ画面のレイアウト 6:4</title>
<desc id="desc">出力画面は左に拡大縮小しない元フレーム、右に上面図を配置します。1920 x 1080 の元動画ではキャンバスは 3200 x 1080 ピクセルで、元フレームのパネルが 1920 x 1080、上面図のパネルが 1280 x 1080 です。上面図は 6.10 x 13.40 m のコートを縦横比を保ったまま収まるように縮小します。</desc>
