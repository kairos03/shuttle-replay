<text x="260" y="341.6" font-size="20" text-anchor="middle" fill="#20312b">あなたの動画フレーム、再サンプリングなし</text>
<text x="260" y="362.6" font-size="20" text-anchor="middle" fill="#20312b">上面図の幅 = 2 * round(W * 4 / 6 / 2) = 1280 px</text>
<text x="260" y="383.6" font-size="20" text-anchor="middle" fill="#20312b">W、H：元のサイズを偶数に切り上げ</text>
<text x="260" y="404.6" font-size="20" text-anchor="middle" fill="#20312b">コートを収まるよう縮小、比率は維持: 75.82 px/m</text>
