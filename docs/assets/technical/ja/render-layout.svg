<text x="260" y="54.1" font-size="20" text-anchor="middle" fill="#5d6b65">例：1920 x 1080 の元動画</text>
<text x="202" y="95.1" font-size="20" text-anchor="middle" fill="#20312b" font-weight="bold">元フレーム、倍率 1.0</text>
