<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" width="520" height="568" viewBox="0 0 520 568" role="img" aria-labelledby="title desc" font-family="&#x27;Noto Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="title">Synthetischer Flug: Geschwindigkeit über der Zeit</title>
<desc id="desc">Die Geschwindigkeit |v| stammt aus den integrierten Geschwindigkeitszuständen derselben zwei Simulationen. Mit Luftwiderstand, k = 0.18 1/m, sinkt sie von 16.13 m/s auf 6.56 m/s beim ersten Bodendurchgang nach 1.56 s; die Endgeschwindigkeit sqrt(g/k) beträgt 7.38 m/s. Ohne Luftwiderstand ändert sich die Geschwindigkeit nur durch die Schwerkraft und beträgt am Boden nach 1.90 s 17.58 m/s. Dies ist ein gewähltes Beispiel, keine Messung.</desc>
