<title id="title">Datenfluss von geprüften Eingaben zur Wiederholung</title>
<desc id="desc">Das Kalibrier-Eingabe-JSON läuft durch calibrate und ergibt das Kalibrier-JSON. Kalibrier-JSON, tracks JSON und review JSON gehen in analyze, das das Analyse-JSON schreibt. Quellvideo und Analyse-JSON gehen in render, das das Wiederholungs-MP4 und das JSON des Render-Berichts schreibt. Der Befehl run führt analyze und render in einem Schritt aus.</desc>
