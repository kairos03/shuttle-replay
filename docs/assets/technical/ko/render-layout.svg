<title id="title">리플레이 화면 배치 6:4</title>
<desc id="desc">출력 화면 왼쪽에는 크기를 바꾸지 않은 원본 프레임, 오른쪽에는 위에서 본 코트가 놓입니다. 원본이 1920 x 1080이면 캔버스는 3200 x 1080 픽셀이고 원본 패널은 1920 x 1080, 탑뷰 패널은 1280 x 1080입니다. 탑뷰는 6.10 x 13.40 m 코트를 비율을 지키며 패널에 맞춥니다.</desc>
