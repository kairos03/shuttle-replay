<text x="260" y="341.6" font-size="20" text-anchor="middle" fill="#20312b">사용자 영상 프레임, 리샘플링 없음</text>
<text x="260" y="362.6" font-size="20" text-anchor="middle" fill="#20312b">탑뷰 너비 = 2 * round(W * 4 / 6 / 2) = 1280 px</text>
<text x="260" y="383.6" font-size="20" text-anchor="middle" fill="#20312b">W, H: 원본 크기를 짝수로 올림</text>
<text x="260" y="404.6" font-size="20" text-anchor="middle" fill="#20312b">코트를 패널에 맞춤, 비율 유지: 75.82 px/m</text>
