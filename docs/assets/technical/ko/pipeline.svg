<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ko" width="520" height="537" viewBox="0 0 520 537" role="img" aria-labelledby="title desc" font-family="&#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, &#x27;Noto Sans CJK KR&#x27;, sans-serif">
<title id="title">검토한 입력에서 리플레이까지의 데이터 흐름</title>
<desc id="desc">보정 입력 JSON은 calibrate를 거쳐 보정 JSON이 됩니다. 보정 JSON, tracks JSON, review JSON은 analyze로 들어가 분석 JSON을 씁니다. 원본 영상과 분석 JSON은 render로 들어가 리플레이 MP4와 렌더 보고서 JSON을 씁니다. run 명령은 analyze와 render를 한 번에 실행합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#20312b"/></marker></defs>
