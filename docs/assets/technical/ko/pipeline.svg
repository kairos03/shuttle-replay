<text x="260" y="30" font-size="18" text-anchor="middle" fill="#20312b" font-weight="bold">검토한 입력에서 리플레이까지의 데이터 흐름</text>
<rect x="20" y="52.1" width="146" height="52.4" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
