<title id="title">合成飞行：高度与水平距离</title>
<desc id="desc">两条曲线均由软件包的 simulate 函数从同一选定初始状态模拟得到。k = 0.18 1/m 的阻力模型在 1.56 s 后、水平距离 8.33 m 处首次触地，穿过球网平面时高度为 4.01 m。无阻力（k = 0）时，同一起点在 1.90 s 后、26.60 m 处触地。两条曲线都在各自首次下降触地处截止。这是选定的示例，不是测量，也不是拟合。</desc>
