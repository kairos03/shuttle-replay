<title id="title">合成飞行：速度与时间</title>
<desc id="desc">速度 |v| 取自同两次模拟中积分得到的速度状态。有阻力（k = 0.18 1/m）时，速度从 16.13 m/s 降至 1.56 s 后首次触地时的 6.56 m/s；终端速度 sqrt(g/k) 为 7.38 m/s。无阻力时速度只受重力影响，1.90 s 后触地时为 17.58 m/s。这是选定的示例，不是测量。</desc>
