<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="it" width="520" height="606" viewBox="0 0 520 606" role="img" aria-labelledby="title desc" font-family="&#x27;Noto Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="title">Flusso dei dati dagli input revisionati al replay</title>
<desc id="desc">Il JSON di input della calibrazione passa per calibrate e produce il JSON di calibrazione. Il JSON di calibrazione, tracks JSON e review JSON entrano in analyze, che scrive il JSON di analisi. Il video sorgente e il JSON di analisi entrano in render, che scrive l'MP4 di replay e il JSON del report di rendering. Il comando run esegue analyze e render in un solo passo.</desc>
