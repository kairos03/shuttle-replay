<text x="93" y="228" font-size="13" text-anchor="middle" fill="#5d6b65">PTS</text>
<rect x="187" y="168.9" width="146" height="69.3" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
