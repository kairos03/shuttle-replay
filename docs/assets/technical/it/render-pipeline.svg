<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="it" width="520" height="910" viewBox="0 0 520 910" role="img" aria-labelledby="title desc" font-family="&#x27;Noto Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="title">Pipeline di rendering con controllo di ogni fotogramma</title>
<desc id="desc">L'MP4 sorgente viene demultiplexato. I pacchetti video sono decodificati nel fotogramma k, confrontato con il fotogramma dell'analisi (frame_id, PTS presente, differenza di PTS al massimo 1e-3 s), poi disegnato e codificato in un MP4 provvisorio. I pacchetti audio sono copiati come flusso nello stesso file provvisorio. Il file provvisorio viene decodificato per intero e verificato, poi collegato all'output senza sovrascrivere. Qualsiasi errore solleva RenderError e rimuove il file provvisorio.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#20312b"/></marker></defs>
<rect x="0.5" y="0.5" width="519" height="909" rx="6" fill="#fbfbf8" stroke="#dfe5e1" stroke-width="1"/>
<text x="260" y="30" font-size="18" text-anchor="middle" fill="#20312b" font-weight="bold">Pipeline di rendering con controllo di ogni</text>
<text x="260" y="53.4" font-size="18" text-anchor="middle" fill="#20312b" font-weight="bold">fotogramma</text>
<rect x="181" y="75.5" width="240" height="31.5" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
<text x="301" y="95.8" font-size="14" text-anchor="middle" fill="#20312b">video sorgente (MP4)</text>
<rect x="181" y="133" width="240" height="38" rx="19" fill="#1f6b45" stroke="none" stroke-width="1"/>
<text x="301" y="156.55" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">demultiplexare</text>
<line x1="301" y1="107" x2="301" y2="133" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="65" y="197" width="230" height="31.5" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
<text x="180" y="217.3" font-size="14" text-anchor="middle" fill="#20312b">pacchetti video</text>
<rect x="337" y="197" width="170" height="31.5" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
<text x="422" y="217.3" font-size="14" text-anchor="middle" fill="#20312b">pacchetti audio</text>
<polyline points="261,171 261,184 180,184 180,197" fill="none" stroke="#20312b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="341,171 341,184 422,184 422,197" fill="none" stroke="#20312b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="65" y="262.5" width="230" height="49" rx="12" fill="#1f6b45" stroke="none" stroke-width="1"/>
<text x="180" y="282.8" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">decodificare il</text>
<text x="180" y="300.3" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">fotogramma k</text>
<line x1="180" y1="228.5" x2="180" y2="262.5" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="65" y="337.5" width="230" height="86.2" rx="4" fill="#ffffff" stroke="#367ca5" stroke-width="1.4"/>
<text x="180" y="357.8" font-size="14" text-anchor="middle" fill="#20312b">controllare il fotogramma k</text>
<text x="180" y="379.7" font-size="13" text-anchor="middle" fill="#20312b">frame_id dell'analisi = k</text>
<text x="180" y="396.6" font-size="13" text-anchor="middle" fill="#20312b">il fotogramma ha un PTS</text>
<text x="180" y="413.5" font-size="13" text-anchor="middle" fill="#20312b">|PTS - pts_s| &lt;= 1e-3 s</text>
<line x1="180" y1="311.5" x2="180" y2="337.5" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="65" y="449.7" width="230" height="49" rx="12" fill="#1f6b45" stroke="none" stroke-width="1"/>
<text x="180" y="470" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">disegnare le</text>
<text x="180" y="487.5" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">sovrapposizioni (Pillow)</text>
<line x1="180" y1="423.7" x2="180" y2="449.7" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="65" y="524.7" width="230" height="49" rx="12" fill="#1f6b45" stroke="none" stroke-width="1"/>
<text x="180" y="545" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">codificare: libx264, h264 o</text>
<text x="180" y="562.5" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">mpeg4</text>
<line x1="180" y1="498.7" x2="180" y2="524.7" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="52" y="250.5" width="256" height="333.2" rx="10" fill="none" stroke="#5d6b65" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="54" y="245.5" font-size="13" text-anchor="start" fill="#5d6b65">k = 0, 1, 2, ...</text>
<rect x="337" y="337.5" width="170" height="49" rx="12" fill="#1f6b45" stroke="none" stroke-width="1"/>
<text x="422" y="357.8" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">copia del flusso,</text>
<text x="422" y="375.3" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">senza ricodifica</text>
<line x1="422" y1="228.5" x2="422" y2="337.5" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="136" y="599.7" width="330" height="31.5" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
<text x="301" y="620" font-size="14" text-anchor="middle" fill="#20312b">MP4 provvisorio</text>
<line x1="180" y1="573.7" x2="180" y2="599.7" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="422" y1="386.5" x2="422" y2="599.7" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="151" y="657.2" width="300" height="49" rx="4" fill="#ffffff" stroke="#367ca5" stroke-width="1.4"/>
<text x="301" y="677.5" font-size="14" text-anchor="middle" fill="#20312b">verificare: decodifica completa, numero</text>
<text x="301" y="695" font-size="14" text-anchor="middle" fill="#20312b">di fotogrammi, tempi dell'audio</text>
<line x1="301" y1="631.2" x2="301" y2="657.2" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="151" y="732.2" width="300" height="49" rx="12" fill="#1f6b45" stroke="none" stroke-width="1"/>
<text x="301" y="752.5" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">collegare all'output, mai</text>
<text x="301" y="770" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">sovrascrivere</text>
<line x1="301" y1="706.2" x2="301" y2="732.2" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="181" y="807.2" width="240" height="31.5" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
<text x="301" y="827.5" font-size="14" text-anchor="middle" fill="#20312b">MP4 di replay</text>
<line x1="301" y1="781.2" x2="301" y2="807.2" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="20" y="860.7" width="480" height="30.9" rx="6" fill="#ffffff" stroke="#ce7317" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="260" y="880.05" font-size="13" text-anchor="middle" fill="#20312b">Qualsiasi errore: RenderError, file provvisorio rimosso</text>
</svg>
