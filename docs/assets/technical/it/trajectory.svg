<title id="title">Volo sintetico: altezza rispetto alla distanza orizzontale</title>
<desc id="desc">Le due curve sono simulate con la funzione simulate del pacchetto a partire dallo stesso stato iniziale scelto. Il modello con resistenza k = 0.18 1/m tocca terra per la prima volta dopo 1.56 s a 8.33 m di distanza orizzontale e attraversa il piano della rete a 4.01 m di altezza. Senza resistenza, k = 0, la stessa partenza tocca terra dopo 1.90 s a 26.60 m. Ogni curva termina al suo primo attraversamento discendente del suolo. È un esempio scelto, non una misura né un fit.</desc>
