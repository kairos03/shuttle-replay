<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" width="520" height="646" viewBox="0 0 520 646" role="img" aria-labelledby="title desc" font-family="&#x27;Noto Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="title">Поток данных от проверенных входов до повтора</title>
<desc id="desc">Входной JSON калибровки проходит через calibrate и даёт JSON калибровки. JSON калибровки, tracks JSON и review JSON поступают в analyze, который записывает JSON анализа. Исходное видео и JSON анализа поступают в render, который записывает MP4 повтора и JSON-отчёт рендеринга. Команда run выполняет analyze и render за один шаг.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#20312b"/></marker></defs>
<rect x="0.5" y="0.5" width="519" height="645" rx="6" fill="#fbfbf8" stroke="#dfe5e1" stroke-width="1"/>
<text x="260" y="30" font-size="18" text-anchor="middle" fill="#20312b" font-weight="bold">Поток данных от проверенных входов до</text>
<text x="260" y="53.4" font-size="18" text-anchor="middle" fill="#20312b" font-weight="bold">повтора</text>
<rect x="20" y="75.5" width="146" height="103.7" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
