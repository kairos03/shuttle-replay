<rect x="306" y="287.5" width="36" height="18" rx="0" fill="#fbfbf8" stroke="none" stroke-width="1"/>
<text x="324" y="301.5" font-size="13" text-anchor="middle" fill="#ce7317" font-weight="bold">run</text>
<text x="260" y="603.9" font-size="13" text-anchor="middle" fill="#5d6b65">run = analyze + render; видео проверяется до записи файлов JSON</text>
<rect x="145.46" y="616.75" width="28" height="16" rx="3" fill="#ffffff" stroke="#20312b" stroke-width="1.2"/>
<text x="181.46" y="629.75" font-size="13" text-anchor="start" fill="#20312b">файл</text>
