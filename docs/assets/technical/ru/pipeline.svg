<line x1="322" y1="127.35" x2="354" y2="127.35" stroke="#20312b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="20" y="209.2" width="146" height="69.3" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
<text x="93" y="229.5" font-size="14" text-anchor="middle" fill="#20312b">tracks JSON</text>
<text x="93" y="251.4" font-size="13" text-anchor="middle" fill="#5d6b65">ваши детекции,</text>
<text x="93" y="268.3" font-size="13" text-anchor="middle" fill="#5d6b65">PTS</text>
<rect x="187" y="209.2" width="146" height="69.3" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
