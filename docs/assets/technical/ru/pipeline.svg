<text x="93" y="113.3" font-size="14" text-anchor="middle" fill="#20312b">калибровки</text>
<text x="93" y="135.2" font-size="13" text-anchor="middle" fill="#5d6b65">точки на полу +</text>
<text x="93" y="152.1" font-size="13" text-anchor="middle" fill="#5d6b65">опорные точки</text>
<text x="93" y="169" font-size="13" text-anchor="middle" fill="#5d6b65">сетки</text>
<rect x="354" y="75.5" width="146" height="103.7" rx="4" fill="#ffffff" stroke="#20312b" stroke-width="1.4"/>
<text x="427" y="121.45" font-size="14" text-anchor="middle" fill="#20312b">JSON калибровки</text>
<text x="427" y="143.35" font-size="13" text-anchor="middle" fill="#5d6b65">P, H, ошибки</text>
<rect x="198" y="108.35" width="124" height="38" rx="19" fill="#1f6b45" stroke="none" stroke-width="1"/>
<text x="260" y="131.9" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">calibrate</text>
