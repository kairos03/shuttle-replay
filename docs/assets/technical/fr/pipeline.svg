<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" width="520" height="629" viewBox="0 0 520 629" role="img" aria-labelledby="title desc" font-family="&#x27;Noto Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="title">Flux de données des entrées vérifiées jusqu'au replay</title>
<desc id="desc">Le JSON d'entrée de calibrage passe par calibrate et donne le JSON de calibrage. Le JSON de calibrage, tracks JSON et review JSON entrent dans analyze, qui écrit le JSON d'analyse. La vidéo source et le JSON d'analyse entrent dans render, qui écrit le MP4 de replay et le JSON du rapport de rendu. La commande run exécute analyze et render en une seule étape.</desc>
