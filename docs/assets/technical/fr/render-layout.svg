<title id="title">Disposition de l'image de replay, 6:4</title>
<desc id="desc">L'image de sortie place à gauche l'image source non mise à l'échelle et à droite la vue de dessus. Avec une source de 1920 x 1080, le canevas mesure 3200 x 1080 pixels : panneau source 1920 x 1080, panneau de vue de dessus 1280 x 1080. La vue de dessus réduit le terrain de 6.10 x 13.40 m pour qu'il tienne en gardant ses proportions.</desc>
