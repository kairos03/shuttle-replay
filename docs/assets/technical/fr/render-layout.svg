<text x="260" y="341.6" font-size="20" text-anchor="middle" fill="#20312b">votre image vidéo, sans rééchantillonnage</text>
<text x="260" y="362.6" font-size="20" text-anchor="middle" fill="#20312b">largeur de la vue de dessus = 2 * round(W * 4 / 6</text>
<text x="260" y="388.6" font-size="20" text-anchor="middle" fill="#20312b">/ 2) = 1280 px</text>
<text x="260" y="409.6" font-size="20" text-anchor="middle" fill="#20312b">W, H : taille source arrondie au nombre pair</text>
<text x="260" y="435.6" font-size="20" text-anchor="middle" fill="#20312b">supérieur</text>
<text x="260" y="456.6" font-size="20" text-anchor="middle" fill="#20312b">terrain ajusté, proportions conservées: 75.82</text>
<text x="260" y="482.6" font-size="20" text-anchor="middle" fill="#20312b">px/m</text>
