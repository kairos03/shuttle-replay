{% extends "!base.html" %}
{% block extrahead %}
{{ super() }}
{%- for url, name in docs_languages %}
<link rel="alternate" hreflang="{{ url }}" href="{{ docs_site_url }}{{ '' if url == 'en' else url ~ '/' }}{{ docs_pagename_html }}">
{%- endfor %}
<link rel="alternate" hreflang="x-default" href="{{ docs_site_url }}{{ docs_pagename_html }}">
<style>
  .docs-language-selector { display: flex; flex-wrap: wrap; gap: 0 .25em; align-items: baseline;
    font-size: var(--font-size--small); margin: 0 0 1.5rem; padding: .5rem .75rem;
    border: 1px solid var(--color-background-border); border-radius: .25rem; }
  .docs-language-label { font-weight: 600; margin-right: .25em; }
</style>
{% endblock %}
