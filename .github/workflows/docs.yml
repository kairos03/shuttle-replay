name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/**"
      - "README*.md"
      - "LICENSE"
      - "NOTICE.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "web/**"
      - "README*.md"
      - "LICENSE"
      - "NOTICE.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Test web demo viewer (runner's preinstalled Node, no npm deps)
        run: |
          node --version
          node --test web/tests/analysis-model.test.mjs web/tests/loader-clock.test.mjs web/tests/flight-context.test.mjs
      - name: Install docs dependencies
        run: uv sync --locked --only-group docs
      - name: Build all languages (strict)
        run: uv run --only-group docs python docs/build.py
      - name: Verify translations and built site
        run: uv run --only-group docs python docs/verify_i18n.py
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
