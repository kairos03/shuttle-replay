<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>shuttle-replay</title>
<meta name="description" content="배드민턴 영상 리플레이 데모입니다.">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="masthead">
  <span class="wordmark">shuttle-replay</span>
  <div class="source">
    <p class="source-msg" id="source-msg" role="status" aria-live="polite"><span id="source-state"></span> <span class="source-name" id="source-name"></span></p>
    <div class="source-actions" id="source-actions" hidden>
      <label class="pick">영상 선택
        <input type="file" id="in-video" accept="video/*" class="sr-only">
      </label>
      <button type="button" id="btn-demo" hidden>데모 영상</button>
    </div>
  </div>
</header>

<main class="workspace">
  <section id="stage" class="stage" aria-label="리플레이 화면" aria-busy="false">
    <figure class="panel panel-source">
      <div class="video-box" id="video-box">
        <video id="video" playsinline muted preload="auto"></video>
        <canvas id="cv-overlay" class="overlay" aria-hidden="true"></canvas>
        <p class="video-msg" id="video-msg" hidden></p>
        <div class="chooser" id="chooser">
          <label class="pick">영상 업로드
            <input type="file" id="in-video-first" accept="video/*" class="sr-only">
          </label>
          <button type="button" id="btn-sample">샘플 보기</button>
        </div>
      </div>
    </figure>
    <section class="transport" aria-label="재생 제어">
      <button type="button" id="btn-play" class="primary" aria-keyshortcuts="Space" disabled>재생</button>
      <label for="rng-time" class="sr-only">타임라인</label>
      <input type="range" id="rng-time" min="0" max="1" step="0.001" value="0" disabled>
    </section>
    <figure class="panel panel-court">
      <figcaption id="court-cue"></figcaption>
      <div class="court-box"><canvas id="cv-court" role="img" aria-label="코트 평면도"></canvas></div>
    </figure>
    <div class="analyzing" id="analyzing" hidden>
      <div class="analyzing-card" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p id="analyzing-label">자동 분석 중</p>
        <progress id="analyzing-progress" max="100" value="0" aria-label="분석 진행률"></progress>
        <p class="analyzing-note">영상은 이 브라우저에서만 처리됩니다.</p>
        <button type="button" id="btn-cancel">분석 취소</button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
