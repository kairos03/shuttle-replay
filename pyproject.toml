[project]
name = "shuttle-replay"
version = "0.1.0"
description = "Offline, review-driven badminton shuttle replay: calibration, physics-constrained flight fitting and rendering from supplied detections."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12"
authors = [{ name = "KAIROS03" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "av>=19.0.2",
    "pillow>=10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
]

[project.scripts]
shuttle-replay = "shuttle_replay.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shuttle_replay"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "NOTICE.md", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
